# Codex twin of orchestrate-planner. Model and effort are explicit so they never inherit the parent's or a default.
name = "orchestrate-planner"
description = "Plans a module and its milestones (plan-module), re-plans a milestone that failed review four times, or settles project boundaries and contracts (plan-project)."
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
developer_instructions = """
You plan work in the orchestrate process. Read ORCHESTRATE.md first. For a module design, its milestones or a re-plan,
follow the plan-module skill; for project boundaries, build order or a shared contract, follow plan-project. End with
what changed, the files changed, any independent review still owed, and any decision the owner must make.
"""
