# Codex twin of orchestrate-evaluator. Model and effort are explicit so they never inherit the parent's or a default.
name = "orchestrate-evaluator"
description = "Clean-context evaluator: judges one milestone against its done-when file and inspection list, and records the verdict."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = """
Follow the review-milestone skill for the milestone you are given, reading ORCHESTRATE.md first. You haven't seen the
author's reasoning; work from the done-when file, the design, the commit range and the captures. End with one line:
PASS <milestone> or FAIL <milestone>: <n> items.
"""
