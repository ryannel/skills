<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestrate</title>
<link rel="icon" href="data:,">
<style>
:root {
  color-scheme: light dark;
  --bg:#f5f5f7; --panel:#ffffff; --subtle:#f2f2f5; --raised:#ffffff; --line:#e6e6eb; --line-strong:#d4d4dc;
  --ink:#16161d; --muted:#5f5f6b; --faint:#63636e; --link:#16161d; --accent:#16161d; --accent-bg:#ececf1;
  --shadow:0 1px 2px #16161d0d,0 1px 1px #16161d08; --shadow-lift:0 6px 20px #16161d14,0 1px 3px #16161d0f;
  --green:#1f6b48; --green-bg:#e8f4ed; --blue:#2559c2; --blue-bg:#e9efff;
  --purple:#6a45ad; --purple-bg:#f1ebfc; --teal:#166c6b; --teal-bg:#e2f3f2;
  --gray:#555b68; --gray-bg:#eeeff3; --amber:#8a4e00; --amber-bg:#fff1d9;
  --red:#a82f42; --red-bg:#fce8eb; --track:#e8e8ee; --edge:#6c6c78;
  --radius:14px; --radius-sm:9px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0c0d10; --panel:#141519; --subtle:#1b1c21; --raised:#1d1e24; --line:#25262d; --line-strong:#34353e;
    --ink:#ededf0; --muted:#a3a3ae; --faint:#8a8a95; --link:#ededf0; --accent:#ededf0; --accent-bg:#26272e;
    --shadow:0 0 0 1px #ffffff05; --shadow-lift:0 10px 30px #00000066,0 0 0 1px #ffffff0a;
    --green:#86d5a9; --green-bg:#16301f; --blue:#a3bdff; --blue-bg:#1d2a4a;
    --purple:#cbb2ff; --purple-bg:#2b2342; --teal:#82d6d2; --teal-bg:#123234;
    --gray:#b9bdc8; --gray-bg:#24262d; --amber:#f6c674; --amber-bg:#3a2a12;
    --red:#ffa3b1; --red-bg:#3d1d25; --track:#24252c; --edge:#9a9aa6;
  }
}
* { box-sizing:border-box }
html { scroll-padding-top:120px; -webkit-font-smoothing:antialiased }
body { margin:0; color:var(--ink); background:var(--bg); font:.875rem/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.003em }
h1,h2,h3,h4,p,ul,ol,dl { margin:0 }
h1 { font-size:1.75rem; letter-spacing:-.025em; line-height:1.2; font-weight:650; overflow-wrap:anywhere }
h2 { font-size:1.0625rem; letter-spacing:-.01em; line-height:1.3; font-weight:600 }
h3 { font-size:.8125rem; font-weight:600 }
a { color:var(--link); text-decoration:none }
.doc a,.prose a,.chip-popover a,.back,a.link,a.path,a.module-name { text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px }
.doc a:hover,.prose a:hover,a.link:hover,a.path:hover,a.module-name:hover { text-decoration-color:currentColor }
button,select { font:inherit; color:var(--ink); background:var(--panel); border:1px solid var(--line-strong); border-radius:8px; padding:6px 11px; cursor:pointer; box-shadow:var(--shadow) }
button:hover,select:hover { background:var(--subtle) }
:focus-visible { outline:2px solid var(--ink); outline-offset:2px }
summary { cursor:pointer; list-style:none }
summary::-webkit-details-marker { display:none }
summary::before { content:""; display:inline-block; width:6px; height:6px; margin-right:9px; border-right:1.5px solid var(--faint); border-bottom:1.5px solid var(--faint); transform:rotate(-45deg) translateY(-2px); transition:transform .15s }
details[open] > summary::before { transform:rotate(45deg) translate(-2px,-1px) }
.bottom summary::before,.board-backlog summary::before { display:none }
code,pre,.mono { font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace; font-size:.85em }
code { background:var(--subtle); border-radius:5px; padding:1px 5px }
pre code { background:none; padding:0 }
code,pre { overflow-wrap:anywhere; white-space:pre-wrap }
pre { background:var(--subtle); border-radius:var(--radius-sm); padding:11px 13px; font-size:.8125rem }
progress { display:block; width:100%; height:6px; appearance:none; border:0; border-radius:8px; background:var(--track); overflow:hidden }
progress::-webkit-progress-bar { background:var(--track) }
progress::-webkit-progress-value { background:var(--ink); border-radius:8px }
progress::-moz-progress-bar { background:var(--ink); border-radius:8px }
svg { display:inline-block; vertical-align:middle; flex:none }
hr { border:0; border-top:1px solid var(--line); margin:16px 0 }
.wrap { width:min(100% - 64px, 1240px); margin-inline:auto }

/* Shell */
header.shell { position:sticky; top:0; z-index:5; background:color-mix(in srgb,var(--bg) 82%,transparent); backdrop-filter:saturate(1.6) blur(14px); -webkit-backdrop-filter:saturate(1.6) blur(14px); border-bottom:1px solid var(--line) }
.top { height:56px; display:flex; align-items:center; justify-content:space-between; gap:12px }
.brand { display:flex; align-items:center; gap:10px; color:var(--ink); font-size:1rem; font-weight:650; letter-spacing:-.02em }
.brand svg { background:var(--ink); color:var(--bg); border-radius:8px; padding:6px; width:28px; height:28px; stroke-width:1.8 }
.snapshot { display:flex; align-items:center; gap:7px; font-size:.8125rem; color:var(--muted); padding:4px 10px; border:1px solid var(--line); border-radius:999px; background:var(--panel) }
.snapshot strong { color:var(--ink); font-weight:600 }
.snapshot time { margin-left:2px }
.nav { display:flex; gap:4px; padding-bottom:8px }
.nav a { display:flex; gap:7px; align-items:center; padding:6px 12px; border-radius:8px; font-size:.8125rem; color:var(--muted); font-weight:550 }
.nav a:hover { color:var(--ink); background:var(--subtle) }
.nav a[aria-current] { color:var(--ink); background:var(--panel); box-shadow:var(--shadow),0 0 0 1px var(--line); font-weight:600 }
.bottom { display:none }
main.wrap { padding-block:36px 80px }

/* Page heading */
.heading { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:28px }
.heading p { margin-top:8px; max-width:72ch; color:var(--muted); font-size:.9375rem }
.kicker { font-size:.75rem; font-weight:600; color:var(--muted); margin-bottom:8px; letter-spacing:.02em }
.state-pill { display:inline-block; line-height:1.5; font-size:.8125rem; color:var(--muted); padding:6px 12px; border-radius:999px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow) }
.state-pill strong { color:var(--ink); font-weight:600 }

/* Layout */
.grid { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); align-items:start; gap:24px }
.grid.even { grid-template-columns:repeat(2,minmax(0,1fr)) }
.stack { display:grid; align-content:start; gap:24px; min-width:0 }
.section-gap { margin-top:40px }

/* Surfaces */
.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); min-width:0; overflow:hidden; box-shadow:var(--shadow) }
.panel:target,.panel:focus-visible { outline:1px solid var(--line-strong); outline-offset:2px }
.panel-head { display:flex; align-items:center; gap:10px; justify-content:space-between; padding:16px 20px 10px; min-height:52px }
.panel-head h2 { display:flex; align-items:center; gap:9px }
.panel-head h2 svg { color:var(--faint) }
.panel-head .count { margin-left:2px }
.panel-content { padding:6px 20px 18px }
.muted,.meta { color:var(--muted) }
.meta { font-size:.8125rem; line-height:1.45 }
.warning-text { color:var(--amber) }
.bar { display:flex; align-items:center; flex-wrap:wrap; gap:6px }
.notice.desktop-note { background:var(--subtle); color:var(--muted) }
.notice { display:flex; align-items:center; gap:8px; background:var(--amber-bg); color:var(--amber); padding:10px 14px; border-radius:var(--radius-sm); margin-bottom:20px; font-size:.8125rem }

/* Stat tiles */
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:28px }
.tile { display:grid; gap:2px; padding:16px 18px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); color:var(--ink); transition:box-shadow .15s,transform .15s }
a.tile:hover { box-shadow:var(--shadow-lift); transform:translateY(-1px) }
.tile .tile-label { font-size:.8125rem; color:var(--muted); display:flex; align-items:center; gap:7px }
.tile .tile-value { font-size:1.75rem; font-weight:650; letter-spacing:-.03em; line-height:1.15 }
.tile .tile-note { font-size:.75rem; color:var(--muted) }
.tile.attention .tile-value { color:var(--amber) }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px }
.stats div { padding:14px 16px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); min-width:0 }
.stats dt { font-size:.75rem; color:var(--muted) }
.stats dd { margin:3px 0 0; display:flex; align-items:center; gap:7px; font-size:1.125rem; font-weight:620; overflow-wrap:anywhere }

/* Chips and tags */
.chip,.tag { --tone:var(--gray); --tint:var(--gray-bg); display:inline-flex; align-items:center; gap:5px; vertical-align:middle; border-radius:6px; padding:1px 7px; font-size:.75rem; line-height:1.55; font-weight:600; color:var(--tone); background:var(--tint); white-space:nowrap; border:1px solid transparent; letter-spacing:.005em }
.chip { font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace; font-size:.71875rem; letter-spacing:0 }
.chip:hover { border-color:currentColor }
.done,.pass { --tone:var(--green); --tint:var(--green-bg) }
.building,.reviewing,.running { --tone:var(--blue); --tint:var(--blue-bg) }
.ready_for_review { --tone:var(--purple); --tint:var(--purple-bg) }
.ready_to_build { --tone:var(--teal); --tint:var(--teal-bg) }
.blocked,.paused { --tone:var(--amber); --tint:var(--amber-bg) }
.failed,.fail { --tone:var(--red); --tint:var(--red-bg) }
.chip.done,.tag.done { background:transparent; border-color:var(--line-strong); color:var(--green) }
.chip.not_started,.tag.not_started { border:1px dashed var(--line-strong); background:transparent; color:var(--muted) }
.chip.waiting,.tag.waiting { background:var(--gray-bg); border-color:var(--line-strong) }
.tag.next { background:var(--ink); border-color:var(--ink); color:var(--panel); font-weight:600 }
.tag.plain { background:var(--subtle); color:var(--muted) }
.status-mark { min-width:1ch; text-align:center; font-size:.84em; line-height:1; flex:none; font-family:system-ui,sans-serif }
.chip.building .status-mark,.chip.reviewing .status-mark { animation:pulse 1.9s ease-in-out infinite }
.dot { display:inline-block; width:7px; height:7px; flex:none; border-radius:50%; background:var(--tone,var(--muted)) }
.dot.building,.dot.reviewing,.building .dot,.reviewing .dot { animation:pulse 1.9s ease-in-out infinite }
@keyframes pulse { 50% { opacity:.35 } }
@media (prefers-reduced-motion:reduce) { * { animation:none!important; transition:none!important } }
.count { display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--subtle); color:var(--muted); font-size:.71875rem; font-weight:600 }
.danger { color:var(--red) }

/* Rows */
.row { padding:11px 20px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap }
.row + .row,.rule { border-top:1px solid var(--line) }
.fill { flex:1; min-width:0 }
.end { margin-left:auto }
.empty { padding:6px 20px 20px; color:var(--muted); font-size:.8125rem }
.toolbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.jump { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 24px; font-size:.8125rem }
.jump a { color:var(--muted); padding:5px 11px; border-radius:999px; border:1px solid var(--line); background:var(--panel) }
.jump a:hover { color:var(--ink); border-color:var(--line-strong) }
.named-chip { display:flex; align-items:center; gap:10px; min-width:0; flex:1 }
.named-chip .chip { flex:none }
td .wp-title { white-space:normal }
.named-list { display:grid; gap:6px; min-width:0 }
.named-chip .chip { flex:none }
.named-chip a:not(.chip),.wp-title { color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.named-chip a:not(.chip):hover,.wp-title:hover { text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line-strong) }
.list-row { display:flex; align-items:center; gap:12px; padding:9px 20px; min-height:42px; border-top:1px solid var(--line); transition:background .12s }
.list-row:hover { background:var(--subtle) }
.list-row .named-chip { flex:1 }
.list-row .side { margin-left:auto; flex:none; color:var(--muted); font-size:.75rem; white-space:nowrap }
.list-row .reason { display:block; color:var(--muted); font-size:.75rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.list-row .stacked { display:grid; min-width:0; flex:1; gap:1px }
.more { border-top:1px solid var(--line) }
.more > summary { padding:10px 20px; font-size:.8125rem; color:var(--muted); font-weight:550 }
.more > summary:hover { color:var(--ink) }
.panel-content .group-label { padding-inline:0 }
.group-label { display:flex; align-items:center; gap:8px; padding:14px 20px 8px; font-size:.75rem; font-weight:600; color:var(--muted) }
.group-label + .list-row { border-top:0 }

/* Needs you */
h1:focus,h1:focus-visible,.section-title:focus-visible { outline:none }
.action-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr)); gap:12px; padding:4px 16px 16px }
.question { display:grid; gap:10px; align-content:start; padding:16px; border-radius:12px; background:var(--subtle); border:1px solid var(--line) }
.question .q-head { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.question .q-text { font-size:.9375rem; line-height:1.5; color:var(--ink); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden }
.question .q-name { font-size:.8125rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.question .q-foot { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:.75rem; color:var(--muted); padding-top:10px; border-top:1px solid var(--line) }
.question .q-foot strong { color:var(--ink); font-weight:600 }
.badge { display:inline-flex; align-items:center; padding:1px 8px; border-radius:999px; font-size:.71875rem; font-weight:600; background:var(--panel); border:1px solid var(--line-strong); color:var(--ink) }

/* Milestones */
.milestone { display:grid; gap:12px; padding:16px 20px; border-top:1px solid var(--line) }
.milestone-top { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap }
.milestone .milestone-title { display:flex; flex-wrap:wrap; row-gap:2px; align-items:baseline; gap:10px; font-weight:600; color:var(--ink); font-size:.9375rem; min-width:0 }
.ref { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.71875rem; font-weight:400; color:var(--faint); letter-spacing:0 }
.milestone-title a { color:inherit; text-decoration:none }
.milestone-title a:hover { text-decoration:underline; text-underline-offset:3px }
.milestone-about { color:var(--muted); max-width:72ch }
.milestone-figure { margin-left:auto; font-size:.8125rem; color:var(--muted); white-space:nowrap }
.milestone-figure strong { color:var(--ink); font-weight:650 }
.segments { display:flex; height:8px; border-radius:999px; overflow:hidden; background:var(--track); gap:2px }
.segments i { display:block; height:100%; background:var(--tone) }
.segments i.done { background:var(--green) }
.segments i.ready_for_review { background:var(--purple) }
.segments i.building,.segments i.reviewing { background:var(--blue) }
.segments i.ready_to_build { background:var(--teal) }
.segments i.blocked { background:var(--amber) }
.segments i.failed { background:var(--red) }
.segments i.waiting { background:var(--edge) }
.segments i.not_started { background:transparent }
.segment-key { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:.75rem; color:var(--muted) }
.segment-key span { display:inline-flex; align-items:center; gap:6px }
.segment-key i { width:8px; height:8px; border-radius:2px; display:inline-block }
.chain { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.8125rem; color:var(--muted) }
.chain .forecast-pill { display:inline-flex; align-items:center; gap:6px; padding:2px 9px; border-radius:999px; font-size:.75rem; font-weight:600; background:var(--subtle); color:var(--ink) }
.chain .forecast-pill.held { background:var(--amber-bg); color:var(--amber) }
.chain-list { display:flex; flex-wrap:wrap; align-items:center; gap:4px }
.chain-list .arrow { color:var(--faint); font-size:.75rem }
.chain-module { font-size:.75rem; font-weight:600; color:var(--muted); margin-right:4px }
.chain-module:hover { color:var(--ink) }
.chain-break { flex-basis:100%; height:2px }
.chain .end { font-weight:550 }
.closed-milestones { padding:12px 20px; border-top:1px solid var(--line); font-size:.8125rem }
.closed-milestones a { color:var(--muted) }
.closed-milestones a:hover { color:var(--ink) }

/* Feed */
.feed-summary { display:flex; flex-wrap:wrap; gap:6px; padding:0 20px 12px }
.feed-summary span { display:inline-flex; gap:5px; align-items:baseline; padding:3px 10px; border-radius:999px; background:var(--subtle); font-size:.75rem; color:var(--muted) }
.feed-summary strong { color:var(--ink); font-weight:650 }
.event { display:grid; grid-template-columns:118px minmax(0,1fr) max-content; gap:12px; align-items:center; padding:9px 20px; border-top:1px solid var(--line); transition:background .12s }
.event:hover { background:var(--subtle) }
.event > .kind { display:flex; align-items:center; gap:7px; font-size:.75rem; color:var(--muted); font-weight:550; white-space:nowrap }
.event > .kind .dot { width:6px; height:6px }
.event>time { text-align:right; color:var(--muted); font-size:.75rem; white-space:nowrap }
.event-text { min-width:0; display:flex }
.day-label { padding:14px 20px 6px; font-size:.75rem; font-weight:600; color:var(--muted); border-top:1px solid var(--line) }
.day-label + .event { border-top:0 }
.fold { padding:12px 20px; border-top:1px solid var(--line); color:var(--muted); font-size:.8125rem }
.fold > .milestone,.fold > .row { margin-top:5px; padding-inline:0 }
.fold > .event { padding-inline:0 }
.reason { color:var(--muted); font-size:.75rem }

/* Docs */
.doc { max-width:76ch; overflow-wrap:anywhere; line-height:1.6 }
.doc > * + * { margin-top:12px }
.doc h2,.doc h3,.doc h4 { margin-top:24px }
.doc ul,.doc ol { padding-left:22px }
.doc li + li { margin-top:6px }
.doc blockquote { margin:12px 0; padding:10px 16px; border-left:3px solid var(--line-strong); background:var(--subtle); border-radius:0 8px 8px 0 }
.doc table { margin-block:12px }
.goal { margin-bottom:24px; overflow:hidden }
.goal .kicker { font-size:.6875rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0 0 8px }
.goal-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:40px; padding:28px 28px 8px }
.goal-headline { font-size:1.625rem; line-height:1.25; font-weight:640; letter-spacing:-.01em; margin:0 0 12px; color:var(--ink); max-width:34ch }
.goal-support { font-size:.9375rem; line-height:1.55; color:var(--muted); margin:0 0 20px; max-width:62ch }
.goal-done { border-left:3px solid var(--green); padding:4px 0 4px 14px; max-width:62ch }
.goal-done p { margin:0; font-size:.9375rem; line-height:1.5; color:var(--ink) }
.goal-open ul { list-style:none; margin:0 0 14px; padding:0; display:grid; gap:2px }
.goal-open li summary { font-size:.8125rem; line-height:1.4; padding:6px 0; color:var(--ink); cursor:pointer }
.goal-open li p { font-size:.78125rem; color:var(--muted); margin:0 0 8px 18px; line-height:1.5 }
.goal-open li + li { border-top:1px solid var(--line) }
.goal-vision { font-size:.8125rem; color:var(--muted); text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px }
.goal-progress { padding:20px 28px 4px; border-top:1px solid var(--line); margin-top:20px }
.goal-where { margin:0 0 14px; font-size:.875rem; color:var(--muted) }
.goal-where strong { color:var(--ink); font-weight:600 }
.goal-ladder { padding:6px 0 20px }
.stepper.goal-ladder li { flex:1 0 84px }
.goal-note { font-size:.75rem; color:var(--muted); margin:0 0 10px }
.goal-step .step-dot { border-color:var(--amber); color:var(--amber) }
.goal-step .step-label { font-weight:600; color:var(--ink) }
.goal-vision-doc { padding:0 28px 24px; border-top:1px solid var(--line) }
.about-grid { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:32px; padding:4px 20px 20px }
.about-grid h3 { font-size:.75rem; color:var(--muted); margin-bottom:8px }
.lede { font-size:1rem; line-height:1.55; color:var(--ink) }
.stepper { display:flex; gap:0; overflow-x:auto; padding:6px 20px 20px; list-style:none; margin:0 }
.stepper li { flex:1 0 108px; position:relative; display:grid; gap:6px; padding-right:16px; min-width:0 }
.stepper li::before { content:""; position:absolute; top:11px; left:24px; right:0; height:2px; background:var(--line-strong) }
.stepper li.closed::before { background:var(--green) }
.stepper li:last-child::before { display:none }
.stepper .step-dot { position:relative; z-index:1; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:.6875rem; font-weight:700; background:var(--panel); border:2px solid var(--line-strong); color:var(--muted) }
.stepper li.closed .step-dot { background:var(--green); border-color:var(--green); color:var(--panel) }
.stepper li.current .step-dot { border-color:var(--ink); color:var(--ink); box-shadow:0 0 0 4px var(--accent-bg) }
.stepper .step-label { font-size:.8125rem; font-weight:600; color:var(--ink); line-height:1.3; hyphens:auto; overflow-wrap:break-word }
.stepper .step-name { font-size:.6875rem; color:var(--faint); line-height:1.35; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; overflow-wrap:anywhere }
.stepper a:hover .step-name { color:var(--ink) }

/* Tables */
.table-wrap { overflow:auto }
table { border-collapse:collapse; width:100%; text-align:left; font-size:.8125rem }
th { color:var(--muted); font-weight:550; white-space:nowrap; font-size:.75rem }
th,td { padding:10px 14px; vertical-align:top; border-bottom:1px solid var(--line) }
th:first-child,td:first-child { padding-left:20px }
th:last-child,td:last-child { padding-right:20px }
thead th { border-bottom:1px solid var(--line); background:var(--subtle) }
tbody tr { transition:background .12s }
tbody tr:hover { background:var(--subtle) }
tbody tr:last-child td { border-bottom:0 }
td.num,th.num { text-align:right }
.module-cell { white-space:nowrap; font-weight:600 }
.module-cell small { color:var(--faint); display:inline-block; width:26px; font-weight:500 }
.wp-strip { display:flex; flex-wrap:wrap; gap:4px; min-width:135px }

/* Plan map */
.map-panel { margin-bottom:24px }
.map-scroller { overflow:auto; background:var(--panel); isolation:isolate; border-top:1px solid var(--line) }
.map-canvas { position:relative; padding-bottom:6px }
.map-lines { position:absolute; inset:0; z-index:1; width:100%; height:100%; pointer-events:none; color:var(--edge) }
.map-edge { fill:none; stroke:currentColor; stroke-width:1.5 }
.map-edge.critical { color:var(--ink); stroke-width:2 }
.map-edge.related { color:var(--ink) }
.map-edge:not(.live):not(.related):not(.dim) { opacity:.4 }
.map-edge.live { color:var(--blue); opacity:.75 }
.map-edge.dim { opacity:.15 }
.segmented-label { align-self:center; padding:0 8px 0 4px; font-size:.75rem; color:var(--muted) }
.map-lane { display:contents }
.pb-scroller { max-height:min(78vh,820px) }
.pb-phone { display:none }
.map-canvas { width:max-content; min-width:100% }
.pb-grid { display:grid; position:relative }
.pb-corner,.pb-head { position:sticky; top:0; z-index:4; background:var(--panel); border-bottom:1px solid var(--line-strong); padding:10px 12px; font-size:.75rem }
.pb-corner { left:0; z-index:5; color:var(--muted); font-weight:600; display:flex; align-items:flex-end }
.pb-head a,.pb-head > div { display:grid; gap:3px; color:var(--ink) }
.pb-head strong { font-size:.8125rem; line-height:1.3; font-weight:600 }
.pb-head span { color:var(--muted); font-size:.71875rem }
.pb-head.current { box-shadow:inset 0 -2px var(--blue); }
.pb-head.current span:not(.tag) { color:var(--blue) }
.pb-head.narrow strong { font-size:.6875rem; font-weight:500; color:var(--muted) }
.pb-head + .pb-head,.pb-cell { border-left:1px solid var(--line) }
.pb-corner,.pb-module { border-right:1px solid var(--line-strong); box-shadow:6px 0 12px -8px #0006 }
.pb-module { position:sticky; left:0; z-index:3; background:var(--panel); display:grid; align-content:start; gap:2px; padding:12px; border-top:1px solid var(--line); font-size:.75rem; color:var(--ink) }
.pb-module b { font-weight:600; overflow-wrap:break-word; hyphens:auto }
.pb-module small { color:var(--muted); font-size:.71875rem }
.pb-cell { display:flex; flex-direction:column; gap:6px; padding:8px; border-top:1px solid var(--line); min-width:0 }
.pb-cell.current { background:color-mix(in srgb,var(--blue) 10%,transparent) }
.pb-cell.narrow { align-items:center; justify-content:center }
.pb-cell.wide { display:grid; grid-template-columns:1fr 1fr; align-content:start; align-items:start }
.pb-cell.wide .pb-more { grid-column:1 / -1 }
.pb-more summary { font-size:.71875rem; color:var(--green); padding:2px 4px; width:max-content }
.pb-more[open] { display:grid; gap:6px }
.pb-next { margin:2px 0; width:max-content }
.pb-phone-col { padding:12px 16px; border-top:1px solid var(--line) }
.pb-phone-col h3 { display:flex; align-items:center; gap:8px; font-size:.875rem; margin:0 0 8px }
.pb-phone-col h3 .meta { margin-left:auto; font-weight:400 }
.pb-phone-row { display:grid; gap:6px; padding:10px 0; border-top:1px solid var(--line); color:var(--ink); min-height:44px }
.pb-phone-row .pb-name { -webkit-line-clamp:3 }
.pb-phone-note { padding:12px 16px }
.wp-inline { color:var(--ink) }
.pb-count { font-size:.71875rem; color:var(--green); padding:1px 4px }
.pb-card { --tone:var(--gray); position:relative; z-index:2; display:grid; gap:7px; padding:8px 10px; background:var(--panel); border:1px solid var(--line-strong); border-left:3px solid var(--tone); border-radius:7px; color:var(--ink); transition:opacity .15s }
.pb-card.not_started { border-left-style:dashed; border-left-color:var(--line-strong) }
.pb-card.waiting { border-left-color:var(--muted) }
.pb-card.late { box-shadow:0 0 0 1px var(--red) }
.pb-card:hover { border-color:var(--ink); border-left-color:var(--tone) }
.pb-name { font-size:.78125rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.pb-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap }
.pb-meta .ref { margin-left:auto }
.pb-done { display:flex; align-items:center; gap:6px; padding:3px 8px; border-left-width:1px; color:var(--muted) }
.pb-done .status-mark { color:var(--green) }
.pb-done .pb-name { -webkit-line-clamp:1; font-size:.71875rem }
.map-chip.related { border-color:var(--ink) }
.map-canvas.inspecting .map-chip:not(.related) { opacity:.3 }
.map-edge.related { color:var(--ink); stroke-width:1.75 }
.map-chip:focus-visible { outline:2px solid var(--ink); outline-offset:3px }
.map-toggle { display:inline-flex; gap:6px; align-items:center; font-size:.8125rem; color:var(--muted) }
.segmented { display:inline-flex; border:1px solid var(--line-strong); border-radius:7px; overflow:hidden }
.segmented button { font:inherit; font-size:.8125rem; padding:4px 12px; background:transparent; color:var(--muted); border:0; cursor:pointer }
.segmented button[aria-pressed="true"] { background:var(--subtle); color:var(--ink) }
.map-toolbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap }
.map-toolbar { position:sticky; left:0; padding:4px 20px 14px; background:var(--panel) }
.map-toolbar label { font-size:.8125rem; color:var(--muted) }
.map-toolbar .meta { margin-left:auto }
.map-toolbar select { max-width:100% }
.legend { padding:0 20px 12px; display:flex; flex-wrap:wrap; gap:6px 8px; list-style:none; margin:0 }
.legend li { margin:0 }
.legend .tag { font-size:.71875rem }
.map-instructions { padding:0 20px 12px; font-size:.75rem; color:var(--muted) }
.map-instructions a { text-decoration:underline; text-decoration-color:var(--line-strong); text-underline-offset:3px }
.map-spacer { margin-bottom:24px }

/* Board */
.board { display:grid; overflow:auto; min-height:170px; gap:10px; padding:4px 16px 16px }
.board-bar { display:flex; align-items:flex-start; gap:8px 24px; flex-wrap:wrap; padding:0 20px 12px }
.board-bar .board-backlog { padding:0; flex:1 1 100%; order:2 }
.board-bar .board-backlog:not([open]) { flex:0 0 auto; order:0 }
.board-empty { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.75rem; color:var(--muted) }
.board-empty span { display:inline-flex; gap:5px; align-items:center }
.board-backlog { padding:0 20px 12px }
.board-backlog summary { width:max-content; font-size:.8125rem; font-weight:600; display:flex; align-items:center; gap:7px; color:var(--muted) }
.board-backlog > .board-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; margin-top:10px }
.board-col { min-width:0; padding:10px; border-radius:12px; background:var(--subtle) }
.board-col h3 { display:flex; justify-content:space-between; align-items:center; gap:4px; font-size:.75rem; margin:2px 2px 10px; color:var(--ink) }
.board-col h3 > span:first-child { display:inline-flex; align-items:center; gap:6px }
.board-col.is-empty { background:transparent; border:1px dashed var(--line) }
.board-col.is-empty h3 { margin-bottom:0; color:var(--muted); flex-wrap:wrap }
.board-card { display:grid; min-width:0; align-content:start; gap:6px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; color:var(--ink); background:var(--panel); box-shadow:var(--shadow); transition:box-shadow .15s,border-color .15s }
.board-card:hover { box-shadow:var(--shadow-lift); border-color:var(--line-strong) }
.board-module { color:var(--muted); font-size:.75rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.board-title { display:flex; align-items:start; gap:7px; min-width:0; font-size:.8125rem }
.board-title .chip { flex:none }
.board-name { white-space:normal; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-height:1.4; font-weight:500 }
.board-card>.tag { white-space:normal; overflow-wrap:anywhere; justify-self:start; background:var(--subtle); color:var(--muted); font-weight:550 }
.board-card .meta { font-size:.71875rem }
.board-backlog .board-card { margin:0 }
.board-col details > summary { font-size:.75rem; color:var(--muted); padding:4px 2px }

/* On-demand panels and timeline */
.on-demand > summary { padding:16px 20px; font-size:.9375rem; font-weight:600 }
.on-demand[open] > summary { border-bottom:1px solid var(--line) }
.on-demand-body .timeline-options { padding:10px 20px }
.timeline { overflow:auto; max-height:520px }
.timeline-grid { min-width:820px }
.timeline-row { display:grid; grid-template-columns:170px 1fr; border-bottom:1px solid var(--line) }
.timeline-row:last-child { border-bottom:0 }
.timeline-label { display:flex; align-items:center; padding:4px 12px 4px 20px; position:sticky; left:0; z-index:2; background:var(--panel); font-size:.75rem }
.timeline-scale { display:flex; justify-content:space-between; padding:6px 9px; gap:4px; font-size:.71875rem }
.timeline-axis { position:sticky; top:0; z-index:3; background:var(--panel) }
.timeline-track { min-height:22px; position:relative; background-image:linear-gradient(to right,var(--line) 1px,transparent 1px); background-size:20% 100% }
.session { position:absolute; min-width:3px; border-radius:3px; background:var(--tone,var(--gray)); height:8px; opacity:.75 }
.session:hover,.session:focus-visible { opacity:1; outline:2px solid var(--ink); z-index:1 }

/* Charts */
.chart { padding:6px 20px 8px; margin:0 }
.chart svg { width:100%; height:auto; display:block; overflow:visible }
.chart .guide { stroke:var(--line); stroke-width:1 }
.chart text { fill:var(--muted); font:11px system-ui }
.chart .chart-bar { fill:var(--ink); opacity:.3 }
.chart .chart-line { fill:none; stroke:var(--ink); stroke-width:2; vector-effect:non-scaling-stroke }
.chart .chart-point { fill:var(--ink) }
.milestone-progress { display:grid; gap:8px; margin-bottom:6px }
.milestone-progress > div { display:flex; justify-content:space-between; gap:12px; align-items:baseline; font-size:.8125rem }
.chart figcaption { font-size:.75rem; color:var(--muted); font-weight:550; margin-bottom:6px }
.chart-key { display:flex; flex-wrap:wrap; gap:4px 14px; padding:0 20px 14px; font-size:.75rem; color:var(--muted); list-style:none; margin:0 }
.chart-key li { display:inline-flex; align-items:center; gap:6px }
.chart-key i { width:9px; height:9px; border-radius:2px; display:inline-block }
.hbars { display:grid; gap:10px; padding:4px 20px 18px }
.hbar { display:grid; grid-template-columns:minmax(90px,140px) 1fr 64px; gap:12px; align-items:center; font-size:.8125rem }
.hbar .track { height:8px; border-radius:999px; background:var(--track); overflow:hidden }
.hbar .track i { display:block; height:100%; border-radius:999px; background:var(--ink) }
.hbar .track i.warn { background:var(--amber) }
.hbar .track i.bad { background:var(--red) }
.hbar .value { text-align:right; color:var(--muted); font-size:.75rem }
.big-number { font-size:1.5rem; font-weight:650; letter-spacing:-.02em }
.bullet-list { padding:4px 20px 18px 38px; font-size:.8125rem }
.bullet-list li + li { margin-top:8px }
.forecast { background:var(--subtle); border-radius:8px; padding:6px 10px }

/* Work package page */
.detail-head { margin-bottom:28px; display:grid; gap:12px }
.detail-head .bar { gap:8px }
.proof-title { max-width:52ch; font-size:1.625rem }
.proof-section { padding:16px 20px; border-top:1px solid var(--line) }
.proof-section > * + * { margin-top:8px }
.proof-section .mono { font-weight:650; font-size:.8125rem }
.proof-section p { font-size:.875rem }
.proof-section.item-failed { box-shadow:inset 3px 0 var(--red) }
.verdicts { display:flex; align-items:center; gap:4px; flex-wrap:wrap }
.verdicts a { width:26px; height:26px; display:grid; place-items:center; border-radius:7px; background:var(--tint,var(--subtle)); color:var(--tone,var(--muted)); font-size:.75rem }
.verdicts a.unjudged .dot { background:none; border:1px solid var(--muted) }
.review { scroll-margin-top:8px }
.review ul { padding-left:20px }
.review li + li { margin-top:4px }
.review-summary.generated { display:flex; align-items:baseline; gap:8px }
.review-summary.generated span:last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.proof-columns { grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) }
.proof-summary { margin-bottom:24px }
.proof-strip { display:grid; gap:10px; padding:4px 20px 18px }
.proof-strip .proof-review { display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:center }
.proof-strip .proof-review > span { font-size:.75rem; font-weight:600; color:var(--muted) }
.proof-cells { display:flex; flex-wrap:wrap; gap:4px }
.proof-cells a { display:inline-flex; align-items:center; justify-content:center; gap:3px; min-width:44px; height:28px; padding:0 6px; border-radius:7px; font-size:.6875rem; font-weight:600; font-family:ui-monospace,"SF Mono",Menlo,monospace; background:var(--tint,var(--subtle)); color:var(--tone,var(--muted)); border:1px solid transparent }
.proof-cells a.pass { background:var(--green-bg); color:var(--green) }
.proof-cells a.fail { background:var(--red-bg); color:var(--red) }
.proof-cells a.unjudged { background:transparent; border:1px dashed var(--line-strong); color:var(--muted) }
.proof-cells a:hover { border-color:currentColor }
.deps { margin-bottom:24px }
.deps .bar { margin-top:4px }
.back { display:inline-flex; gap:6px; align-items:center; margin-bottom:16px; font-size:.8125rem; color:var(--muted); text-decoration:none }
.back:hover { color:var(--ink) }
.choice { padding:12px 0; overflow-wrap:anywhere }
.choice + .choice { border-top:1px solid var(--line) }
.choice p { line-height:1.55 }
.choice .bar { margin-top:6px }
td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap }
.module-progress { display:grid; gap:4px; min-width:120px }
.module-progress .segment-key { display:none }
.warning-row { display:grid; gap:4px }
.warning-row .side { margin:0; text-align:left; white-space:normal; font-size:.8125rem; color:var(--muted) }
.path { overflow-wrap:anywhere; word-break:break-word }
.path-list .row { align-items:baseline }
.statement-toggle { padding:2px 0 }
.statement-toggle summary { min-height:28px; display:flex; align-items:flex-start }
.statement-toggle summary code { white-space:normal }
.statement-toggle:not([open]) summary span { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; white-space:normal; max-width:calc(100% - 20px) }
.reviewer-question { border-radius:8px; padding:8px 11px; background:var(--subtle); font-size:.8125rem!important }
.plan-disclosure { padding:0 }
.plan-disclosure > summary { padding:0 20px 12px; font-size:.8125rem; color:var(--muted) }
.module-mini { display:none }
.module-name { font-weight:600 }
.desktop-note,.mobile-only { display:none }
dialog { background:var(--panel); color:var(--ink); border:1px solid var(--line-strong); border-radius:var(--radius); padding:20px; width:min(960px, 92vw); max-height:85vh; box-shadow:var(--shadow-lift) }
dialog::backdrop { background:#0a0b0e99; backdrop-filter:blur(2px) }
dialog header { display:flex; justify-content:space-between; gap:12px; margin-bottom:12px }
dialog pre { max-height:62vh; overflow:auto }
dialog img { display:block; max-width:100%; height:auto }
.skip-link { position:fixed; left:12px; top:8px; z-index:20; background:var(--panel); border:2px solid var(--ink); border-radius:8px; padding:7px 12px; transform:translateY(-160%) }
.skip-link:focus { transform:none }
.visually-hidden { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap }
.shell-labels { display:flex; gap:8px; align-items:center }
.update-button[hidden] { display:none }
.chip-popover { position:fixed; inset:auto; margin:0; width:min(340px,calc(100vw - 24px)); max-height:min(300px,60vh); overflow:auto; padding:14px; color:var(--ink); background:var(--raised); border:1px solid var(--line-strong); border-radius:12px; box-shadow:var(--shadow-lift); overflow-wrap:anywhere; font-size:.8125rem }
.chip-popover p+p,.chip-popover .bar { margin-top:6px }
.chip-popover a { display:inline-flex; min-height:30px; align-items:center }
.chip-popover strong { font-size:.875rem; line-height:1.45 }
a[href] { scroll-margin-bottom:8px }
.section-title { display:flex; align-items:baseline; gap:10px; margin:44px 0 14px }
.section-title h2 { font-size:1.0625rem; font-weight:650; letter-spacing:-.015em }
.section-title p { color:var(--muted); font-size:.8125rem }
@media (max-height:600px) { header.shell { position:static } html { scroll-padding-top:12px } }

@media (max-width:760px) {
  html { scroll-padding-top:70px; scroll-padding-bottom:calc(76px + env(safe-area-inset-bottom)) }
  .wrap { width:calc(100% - 28px) }
  main.wrap { padding-block:22px 96px }
  .top { height:54px }
  .nav { display:none }
  .bottom { position:fixed; inset:auto 0 0; padding-bottom:env(safe-area-inset-bottom); z-index:6; display:grid; grid-template-columns:repeat(4,1fr); align-items:center; background:color-mix(in srgb,var(--panel) 88%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line) }
  .bottom a,.bottom summary { display:grid; place-items:center; gap:3px; min-height:56px; font-size:.6875rem; color:var(--muted); list-style:none; font-weight:550 }
  .bottom a[aria-current] { color:var(--ink); font-weight:650 }
  .bottom-menu { position:absolute; bottom:calc(60px + env(safe-area-inset-bottom)); right:8px; padding:4px; border:1px solid var(--line); border-radius:12px; background:var(--raised); min-width:160px; box-shadow:var(--shadow-lift) }
  .bottom-menu a { min-height:42px; font-size:.875rem }
  .heading { align-items:flex-start; margin-bottom:18px; flex-wrap:wrap; gap:10px }
  h1 { font-size:1.5rem }
  .proof-title { font-size:1.3rem }
  .grid,.grid.even,.proof-columns,.about-grid { grid-template-columns:minmax(0,1fr) }
  .grid,.stack { gap:16px }
  .now-grid > .stack { display:contents }
  #needs-you { order:-1 }
  #milestones { order:0 }
  #recent-events { order:2 }
  #running-now { order:1 }
  #waiting { order:3 }
  .state-pill { border-radius:12px; width:100% }
  .tiles { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:18px }
  .tile { padding:12px 14px }
  .tile .tile-value { font-size:1.375rem }
  .tile:last-child:nth-child(odd) { grid-column:1/-1 }
  .panel-head { padding-inline:16px; flex-wrap:wrap; row-gap:4px }
  .goal-grid { grid-template-columns:minmax(0,1fr); gap:24px; padding:20px 16px 4px }
  .goal-progress,.goal-vision-doc { padding-inline:16px }
  .goal-headline { font-size:1.3125rem }
  .panel-content,.row,.milestone,.proof-section,.list-row,.event,.group-label,.more > summary,.fold,.closed-milestones,.day-label,.feed-summary,.legend,.map-instructions,.map-toolbar,.hbars,.chart,.chart-key,.stepper,.board-backlog,.empty,.about-grid { padding-inline:16px }
  .action-grid { padding-inline:12px }
  th:first-child,td:first-child { padding-left:16px }
  .event { grid-template-columns:minmax(0,1fr) max-content; gap:4px 10px }
  .event > .kind { grid-column:1/-1 }
  .desktop-only { display:none!important }
  .desktop-note,.mobile-only { display:block }
  .responsive,.responsive tbody { display:block }
  .responsive thead { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%) }
  .responsive tr { display:block; padding:10px 16px; border-bottom:1px solid var(--line) }
  .responsive tr:last-child { border-bottom:0 }
  .responsive td { display:block; border:0; padding:2px 0!important; overflow-wrap:anywhere }
  .responsive td[data-label]::before { content:attr(data-label) " · "; color:var(--muted) }
  .responsive td .wp-title { white-space:normal }
  .responsive td.is-empty { display:none }
  .goal-ladder { display:none }
  .board { display:block; min-height:0; padding-inline:12px }
  .board-col { margin-bottom:10px }
  .board-cards { display:grid; grid-template-columns:minmax(0,1fr); gap:8px }
  .board-card { margin:0 }
  .board-col details .board-cards { margin-top:8px }
  .board-col.is-empty { padding-block:8px }

function chip(key,full=false,extra="") {

};

};

function nav(area) {

}
const milestoneOf=slug=>model.milestones.find(m=>m.label===slug);

const milestoneLink=(slug,text)=>link("#/milestone/"+slug,text ?? milestoneName(slug));

const kindDot={done:"done",ready_for_review:"ready_for_review",blocked:"blocked",review_failed:"failed",plan_changed:"waiting",merged:"done"};

  return withDays(events.slice(0,shown))+(events.length>shown ? `<details class="more" id="${id}-more"><summary>Show ${events.length-shown} more</summary>${withDays(events.slice(shown))}</details>` : "");

function eventRows() {
  const counts=Object.fromEntries(groupBy(model.now.event_times.filter(([seconds])=>seconds*1000>seen),([,kind])=>kind));
  const kinds={done:"done",ready_for_review:"ready for review",blocked:"blocked",review_failed:"review failures",plan_changed:"plan changes",merged:"merges"};
  const total=Object.values(counts).reduce((sum,rows)=>sum+rows.length,0);
  if (!total) return blank("Nothing changed since you last looked.");
  const recent=model.now.recent_events.filter(e=>Date.parse(e.at)>seen);
  const tooling=e=>e.kind==="plan_changed" && /orchestrat|renam|migrat/i.test(e.text || "") && (e.modules?.length || 0)>3;

function waitingRow(w,on) {

function nowScreen() {

    `<div class="grid now-grid section-gap"><div class="stack">

const slug = value => value.toLowerCase().replace(/[^a-z0-9\s-]/g,"").trim().replace(/\s+/g,"-");

  for (const match of text.matchAll(tokens)) {

    else if (raw.startsWith("**")) html+=`<strong>${inline(raw.slice(2,-2),source)}</strong>`;

  const passed=judged.filter(([,verdict])=>verdict==="pass").length;

    values.length>limit ? [...values.slice(0,limit),`${values.length-limit} more`] : values);
  const named=review.findings.map(f=>f.name).filter(Boolean);
  let summary;
  if (review.verdict==="fail") {
    summary=failed.length ? "Failed on "+itemList(failed,3)+"." : "Failed review.";
  } else if (review.verdict==="pass") {
    summary=passed ? `Passed ${passed===items.length ? "all " : ""}${passed} ${passed===1 ? "item" : "items"}.` : "Passed review.";
  } else {
    summary=human(review.verdict)+".";
  }
  if (named.length) summary+=" "+itemList(named,2)+".";
  else if (!failed.length && !passed) summary+=" No item verdicts recorded.";

async function loadDocument(doc,anchor) {
  const target=byId("document-body");
  if (!target) return;
  if (!documentRequests.has(doc.path)) {
    documentRequests.set(doc.path,readResponse(contentUrl(doc.path)).then(response=>response.text()));
  }
  try {
    const text=await documentRequests.get(doc.path);
    if (!target.isConnected) return;
    target.innerHTML=panelBody(markdown(text,doc.path));
    if (anchor) jump(decodeURIComponent(anchor));
  } catch {
    documentRequests.delete(doc.path);
    if (target.isConnected) target.innerHTML=blank("Document could not load.");
  }
}
function missing() {
  return header("Page not found")+link("#/now","Back to Now");
}

const routeStates=new Map();
let pendingModel, connected=false;
let focusBeforeUpdate=null;
let popoverTrigger=null, popoverTimer, suppressPopover=false, selectedMapKey=null;
let lastChange=null;
const popover=byId("chip-popover");
const announce=text=>{ byId("announcements").textContent=text; };
history.scrollRestoration="manual";

function focusTarget(target,scroll=false) {
  if (!target) return;
  if (!target.matches("a,button,select,summary,[tabindex]")) target.tabIndex=-1;
  target.focus({preventScroll:true});
  if (scroll) target.scrollIntoView({block:"start",inline:"nearest"});
}
function jump(id) {
  const target=byId(id);
  if (!target) return false;
  for (let parent=target.parentElement;parent;parent=parent.parentElement) {
    if (parent instanceof HTMLDetailsElement) parent.open=true;
  }
  focusTarget(target,true);
  return true;
}
function focusToken(element) {
  if (!element || element===document.body) return null;
  if (element.id) return {id:element.id};
  const field=element.matches("summary") ? "summary" : element.dataset.wp ? "[data-wp]" :
    element.matches("[href]") ? "[href]" : null;
  if (!field) return null;
  const scope=element.parentElement.closest("[id]")?.id || "main";
  const value=element.dataset.wp || element.getAttribute("href") || element.textContent.trim();
  const read=e=>e.dataset.wp || e.getAttribute("href") || e.textContent.trim();
  const peers=[...byId(scope).querySelectorAll(field)].filter(e=>read(e)===value);
  return {scope,field,value,index:peers.indexOf(element)};
}
function findFocus(token) {
  if (!token) return null;
  if (token.id) return byId(token.id);
  const read=e=>e.dataset.wp || e.getAttribute("href") || e.textContent.trim();
  return [...(byId(token.scope)?.querySelectorAll(token.field) || [])].filter(e=>read(e)===token.value)[token.index];
}
function currentView() {
  const active=document.activeElement;
  return {x:scrollX,y:scrollY,map:byId("map-region")?.scrollLeft || 0,focus:focusToken(popover.contains(active) ? popoverTrigger : active),
    disclosures:[...main.querySelectorAll("details")].map(d=>[focusToken(d.querySelector("summary")),d.open]).filter(([token])=>token)};
}
function restoreView(view) {
  for (const [token,open] of view.disclosures) {
    const disclosure=findFocus(token)?.closest("details");
    if (disclosure) disclosure.open=open;
  }
  window.scrollTo(view.x,view.y);
  if (byId("map-region")) byId("map-region").scrollLeft=view.map;
  const target=findFocus(view.focus);
  focusTarget(target || main.querySelector("h1"));
}
function navigate(hash) {
  if (hash===(location.hash || "#/now")) {
    const [,section,segment,detail]=hash.split("/");
    if (section==="plan" && segment) jump(segment);
    else focusTarget(main.querySelector("h1"),true);
    return;
  }
  if (previousRoute) routeStates.set(previousRoute,currentView());
  history.pushState(null,"",hash);
  render();
}
function connectionStatus() {
  const status=connected && navigator.onLine ? "Live" : "Disconnected, last update";
  byId("snapshot").innerHTML=`<i class="dot ${status==="Live" ? "done" : ""}" aria-hidden="true"></i><strong>${status}</strong><span>${time(model.project.built_at)}</span>`;
}
function render({force=false,restore=false}={}) {
  if (!model && !pendingModel) return;
  if (/^#\/now\/milestone\//.test(location.hash)) history.replaceState(null,"",location.hash.replace("#/now/milestone/","#/milestone/"));
  const hash=location.hash || "#/now";
  const refresh=hash===previousRoute;
  const active=document.activeElement;
  if (pendingModel && refresh && !force && (active?.closest("#main .panel") || popover.matches(":popover-open") || byId("file-view").open)) {
    if (!focusBeforeUpdate) focusBeforeUpdate=focusToken(active);
    byId("show-updates").hidden=false;
    const updates=pendingModel.now.recent_events.filter(item=>!lastChange || item.at>lastChange);
    announce(updates.length ? `${updates.length} new changes. ${human(updates[0].kind)} ${updates[0].ref || ""}. Choose Updated, show changes.` :
      "Updated project data available. Choose Updated, show changes to keep your place.");
    return;
  }
  const view=refresh ? currentView() : restore ? routeStates.get(hash) : null;
  if (refresh && focusBeforeUpdate && (active===byId("show-updates") || active===document.body)) view.focus=focusBeforeUpdate;
  if (!refresh && restore && previousRoute) routeStates.set(previousRoute,currentView());
  const updated=Boolean(pendingModel && model);
  if (pendingModel) applyModel();
  focusBeforeUpdate=null;
  byId("show-updates").hidden=true;
  closePopover();
  const [,section,segment,detail,anchor]=hash.split("/");
  const area=areas.includes(section) ? section : ["module","wp","doc","milestone"].includes(section) ? "plan" : section==="session" ? "machinery" : "now";
  if (areas.includes(section)) lastArea=section;
  if (section==="plan") chosen=segment==="map" && detail ? detail : model.milestones.find(m=>!m.closed)?.label || "";
  if (section==="plan" && segment==="map" && detail==="all") chosen="";
  nav(area);
  const screens={now:nowScreen,plan:()=>planScreen(segment),delivery:deliveryScreen,
    machinery:()=>historyPage("machinery"),retro:()=>historyPage("retro"),session:()=>back("#/machinery","Machinery")+historyPage("session"),
    milestone:()=>milestoneScreen(segment),module:()=>moduleScreen(segment),wp:()=>workPackageScreen(segment),doc:()=>docScreen(segment,detail)};
  main.innerHTML=(Object.hasOwn(screens,section) ? screens[section] : missing)();
  document.title=(section==="milestone" ? milestoneName(segment) : section==="wp" ? (packages[segment]?.name || segment) : section==="module" ? moduleName(segment) : human(section || "now"))+" · "+model.project.name;
  focusedMapKey=hoveredMapKey=selectedMapKey=null;
  drawMap();
  previousRoute=hash;
  connectionStatus();
  if (view) restoreView(view);
  else {
    window.scrollTo(0,0);
    focusTarget(main.querySelector("h1"));
    if (section==="plan" && segment) jump(segment);
  }
  if (["machinery","retro","session"].includes(section)) loadHistoryInto(main.querySelector("[data-history-view]"));
  if (section==="doc" && byId("document-body")) loadDocument(model.documents[segment+"/"+detail],view ? null : anchor);
  if (refresh && updated) announce("Updates shown. Your place on this page was kept.");
  lastChange=model.now.recent_events[0]?.at || lastChange;
}
function showPopover(trigger,openLink=false) {
  const key=trigger.dataset.wp;
  const w=packages[key];
  if (!w || suppressPopover) return;
  clearTimeout(popoverTimer);
  if (popoverTrigger!==trigger || !popover.matches(":popover-open")) {
    popoverTrigger=trigger;
    const onChain=model.milestones.filter(m=>m.longest_chain.includes(key)).map(m=>m.name);
    popover.innerHTML=`<p class="meta">${moduleLink(w.module)} · <span class="ref">${esc(w.id)}</span></p><p><strong>${esc(w.name)}</strong></p>
      <p>${tag(w.status)} ${w.waiting ? explainWait(w) : ""}
      ${(w.waiting?.since || w.status_since) ? " · since "+time(w.waiting?.since || w.status_since) : ""}</p>
      <p class="meta">${w.depends_on.length} dependencies · ${w.needed_by.length} needed by
      ${w.closes ? " · closes "+esc(milestoneName(w.closes)) : ""}${onChain.length ? " · needed for "+esc(onChain.join(", ")) : ""}</p>
      <a class="popover-open-link" href="#/wp/${esc(key)}">Open work package</a>`;
    if (!popover.matches(":popover-open")) popover.showPopover();
    const r=trigger.getBoundingClientRect();
    const bottomBar=byId("mobile");
    const viewBottom=getComputedStyle(bottomBar).display==="none" ? innerHeight : bottomBar.getBoundingClientRect().top;
    const below=r.bottom;
    popover.style.left=Math.max(8,Math.min(r.left,innerWidth-popover.offsetWidth-8))+"px";
    popover.style.top=Math.max(8,below+popover.offsetHeight<=viewBottom-8 ? below : Math.min(r.top-popover.offsetHeight,viewBottom-popover.offsetHeight-8))+"px";
  }
  if (openLink) focusTarget(popover.querySelector(".popover-open-link"));
}
function closePopover(returnFocus=false) {
  clearTimeout(popoverTimer);
  if (popover.matches(":popover-open")) popover.hidePopover();
  if (returnFocus && popoverTrigger?.isConnected) {
    suppressPopover=true;
    focusTarget(popoverTrigger);
    suppressPopover=false;
  }
  popoverTrigger=null;
}
function queuePopoverClose() {
  clearTimeout(popoverTimer);
  popoverTimer=setTimeout(()=>{
    if (!popover.matches(":hover") && !popover.contains(document.activeElement) &&
        popoverTrigger!==document.activeElement) closePopover();
  },180);
}
function moveWithin(region,event) {
  const map=region.id==="map-region";
  const active=document.activeElement;
  const keys=[...region.querySelectorAll(map ? ".map-chip" : ".session")];
  const i=keys.indexOf(active);
  let target;
  if (event.key==="Home") target=keys[0];
  else if (event.key==="End") target=keys.at(-1);
  else if (i<0) target=keys[0];
  else if (map && ["ArrowUp","ArrowDown"].includes(event.key)) {
    const lane=active.closest(".map-lane");
    const lanes=[...region.querySelectorAll(".map-lane")].filter(l=>l.querySelector(".map-chip"));
    const next=lanes[lanes.indexOf(lane)+(event.key==="ArrowUp" ? -1 : 1)];
    const index=[...lane.querySelectorAll(".map-chip")].indexOf(active);
    if (next) {
      const chips=next.querySelectorAll(".map-chip");
      target=chips[Math.min(index,chips.length-1)];
    }
  } else target=keys[i+(["ArrowUp","ArrowLeft"].includes(event.key) ? -1 : 1)];
  event.preventDefault();
  if (target) {
    region.tabIndex=-1;
    target.scrollIntoView({block:"nearest",inline:"center"});
    focusTarget(target);
  }
}
async function showFile(path) {
  const dialog=byId("file-view");
  const full=(model.project.source_root+"/"+path).replace(/\/\.\//g,"/");
  const local='<p class="muted">File unavailable here. Open this path in your checkout.</p>';
  const available=availableEvidence.has(path) ||
    [model.project.plans,model.project.evidence].some(folder=>path.startsWith(folder+"/"));
  const url=contentUrl(path);
  const isText=/\.(md|json|log|txt|csv)$/i.test(path);
  let contents=local;
  if (available && isText) contents='<p class="muted">Loading evidence…</p>';
  else if (available && /\.(png|jpe?g|webp|gif)$/i.test(path)) contents=`<img alt="${esc(path)}" src="${esc(url)}">`;
  else if (available) contents=`<p><a download href="${esc(url)}">Download file</a></p>`;
  dialog.innerHTML=`<header><div class="fill"><h2 id="file-title">${esc(path.split("/").at(-1))}</h2><p class="meta path">${esc(path)}</p></div><form method="dialog"><button>Close</button></form></header>`
    +`<div data-file-content>${contents}</div><p class="meta path" style="margin-top:8px">${esc(full)}</p>`;
  dialog.showModal();
  if (!available || !isText) return;
  const target=dialog.querySelector("[data-file-content]");
  try {
    const response=await readResponse(url);
    const text=await response.text();
    target.innerHTML=`<pre>${esc(text)}</pre>`;
  } catch {
    target.innerHTML=local;
  }
}


document.addEventListener("click",event=>{
  if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
  const jumped=event.target.closest("[data-jump]");
  const file=event.target.closest("[data-file]");
  const retry=event.target.closest("[data-history-retry]");
  const mapChip=event.target.closest(".map-chip");
  const navLink=event.target.closest('a[href^="#/"]');
  if (jumped) { event.preventDefault(); jump(jumped.dataset.jump); }
  else if (file) { event.preventDefault(); showFile(file.dataset.file); }
  else if (retry) loadHistoryInto(retry.closest("[data-history-view]"));
  else if (event.target.closest("[data-board-lines]")) {
    mapAllLines=event.target.closest("[data-board-lines]").dataset.boardLines==="all";
    try { localStorage.setItem(linesKey,mapAllLines ? "all" : "selected"); } catch {}
    for (const button of main.querySelectorAll("[data-board-lines]")) button.setAttribute("aria-pressed",String((button.dataset.boardLines==="all")===mapAllLines));
    drawMap();
  }
  else if (event.target.closest("[data-board-mode]")) { mapAhead=event.target.closest("[data-board-mode]").dataset.boardMode==="ahead"; render({force:true,restore:true}); }
  else if (mapChip) {
    event.preventDefault();
    selectedMapKey=mapChip.dataset.wp;
    drawMap();
    showPopover(mapChip,event.detail===0);
  } else if (navLink) {
    event.preventDefault();
    navigate(navLink.hash);
  }
});
document.addEventListener("pointerdown",event=>{
  const more=byId("mobile").querySelector("details");
  if (more?.open && !more.contains(event.target)) more.open=false;
  if (!popover.contains(event.target) && !event.target.closest("[data-wp]")) closePopover();
});
document.addEventListener("keydown",event=>{
  if (event.key==="Escape") {
    if (popover.matches(":popover-open")) {
      event.preventDefault();
      closePopover(popover.contains(document.activeElement));
      selectedMapKey=null;
      drawMap();
    } else {
      const more=byId("mobile").querySelector("details[open]");
      if (more) { more.open=false; focusTarget(more.querySelector("summary")); }
    }
  }
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Home","End"].includes(event.key)) {
    const region=event.target.closest("#map-region,#timeline-region");
    if (region) moveWithin(region,event);
  }
});
main.addEventListener("change",event=>{
  if (event.target.id==="milestone-select") navigate("#/plan/map/"+(event.target.value || "all"));
  if (event.target.id==="timeline-window") {
    timelineHours=Number(event.target.value);
    byId("timeline-chart").innerHTML=timeline();
  }
});
let allCommitsRequest;
main.addEventListener("toggle",async event=>{
  const target=event.target;
  if (!target.open) return;
  if (target.matches("[data-history-panel]")) loadHistoryInto(target.querySelector("[data-history-view]"));
  if (!target.dataset.changes || target.dataset.loaded) return;
  target.dataset.loaded="true";
  let remaining;
  try {
    if (target.dataset.changes==="all") {
      allCommitsRequest ||= readResponse("plan-commits.json").then(r=>r.json());
      remaining=(await allCommitsRequest).slice();
    } else remaining=model.plan_changes.slice(12);
  } catch {
    allCommitsRequest=null;
    delete target.dataset.loaded;
    target.insertAdjacentHTML("beforeend",blank("Commits could not load. Close and reopen to retry."));
    return;
  }
  if (!target.isConnected || !remaining.length) return;
  const button=document.createElement("button");
  const append=()=>{
    button.insertAdjacentHTML("beforebegin",changesList(remaining.splice(0,12)));
    button.textContent="Show next "+Math.min(12,remaining.length);
    if (!remaining.length) button.remove();
  };
  button.addEventListener("click",append);
  target.append(button);
  append();
},true);
main.addEventListener("pointerover",event=>{
  const node=event.target.closest("[data-wp]");
  if (!node || node.contains(event.relatedTarget) || event.pointerType==="touch") return;
  if (node.matches(".map-chip")) { hoveredMapKey=node.dataset.wp; drawMap(); }
  showPopover(node);
});
main.addEventListener("pointerout",event=>{
  const node=event.target.closest("[data-wp]");
  if (!node || node.contains(event.relatedTarget)) return;
  if (node.matches(".map-chip")) { hoveredMapKey=null; drawMap(); }
  queuePopoverClose();
});
main.addEventListener("focusin",event=>{
  const active=event.target;
  if (active.matches(".map-chip")) {
    focusedMapKey=active.dataset.wp;
    byId("map-region").tabIndex=-1;
    drawMap();
  }
  if (active.matches(".session")) byId("timeline-region").tabIndex=-1;
  if (active.matches("[data-wp]")) showPopover(active);
  if (matchMedia("(max-width:760px)").matches) {
    const r=active.getBoundingClientRect();
    const bottom=byId("mobile").getBoundingClientRect().top;
    if (r.bottom>bottom-8 && r.height<innerHeight/2) {
      window.scrollBy(0,r.bottom-bottom+12);
      if (popoverTrigger===active) { closePopover(); showPopover(active); }
    }
  }
});
main.addEventListener("focusout",event=>{
  const region=event.target.closest("#map-region,#timeline-region");
  if (region && !region.contains(event.relatedTarget)) region.tabIndex=0;
  if (event.target.matches(".map-chip")) { focusedMapKey=null; drawMap(); }
  queuePopoverClose();
});
popover.addEventListener("pointerenter",()=>clearTimeout(popoverTimer));
popover.addEventListener("pointerleave",queuePopoverClose);
popover.addEventListener("focusout",queuePopoverClose);
byId("show-updates").addEventListener("click",()=>{ if (pendingModel) render({force:true}); });
window.addEventListener("popstate",()=>{ if (location.hash!==previousRoute) render({restore:true}); });
window.addEventListener("hashchange",()=>{ if (location.hash!==previousRoute) render(); });
window.addEventListener("resize",drawMap);
window.addEventListener("offline",()=>{ if (model) connectionStatus(); });
window.addEventListener("online",()=>{ if (model) connectionStatus(); });
function applyModel() {
  const first=!model;
  model=pendingModel;
  pendingModel=undefined;
  historyData=historyRequest=allCommitsRequest=undefined;
  documentRequests.clear();
  modules=Object.fromEntries(model.modules.map(m=>[m.id,m]));
  packages=model.work_packages;
  availableEvidence=new Set();
  for (const w of Object.values(packages)) {
    for (const review of w.reviews) if (review.text_here) availableEvidence.add(review.text);
    for (const item of w.items) {
      for (const evidence of item.evidence || []) if (evidence.here) availableEvidence.add(evidence.path);
    }
  }
  snapshot=Date.parse(model.project.built_at || model.project.snapshot_at);
  const seenKey="orchestrate-last-seen:"+model.project.source_root;
  const opened=Math.min(Date.now(),snapshot);
  if (first) seen=opened-day;
  try {
    const previous=Number(localStorage.getItem(seenKey));
    if (first && previous>0 && previous<opened) seen=previous;
    localStorage.setItem(seenKey,String(opened));
  } catch { /* The page still works when storage is disabled. */ }
  byId("brand").innerHTML=icon("project")+esc(model.project.name);
}
let fetching=false, fetchAgain=false;
async function refreshModel() {
  fetchAgain=true;
  if (fetching) return;
  fetching=true;
  try {
    while (fetchAgain) {
      fetchAgain=false;
      pendingModel=await (await readResponse("model.json")).json();
      render();
    }
  } catch (error) {
    if (!model) main.innerHTML=header("Project could not load",error.message);
    console.error(error);
  } finally {
    fetching=false;
    if (fetchAgain) refreshModel();
  }
}
if (!location.hash) history.replaceState(null,"","#/now");
const events=new EventSource("/events");
events.addEventListener("open",()=>{
  connected=true;
  if (model) connectionStatus();
  refreshModel();
});
events.addEventListener("changed",refreshModel);
events.addEventListener("error",()=>{
  connected=false;
  if (model) connectionStatus();
  else main.innerHTML=header("Project disconnected","Waiting for the local server to reconnect.");
});
</script>
