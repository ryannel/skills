# The Codex copy of orchestrate-reviewer, so that a Codex chat can start a reviewer in a new session. This file
# names the model and effort because Codex reads them from here.
name = "orchestrate-reviewer"
description = "Reviewer for the orchestrate set: a new session that judges one milestone that is Ready for Review against its done-when file, or a design against the human's request, and writes the review."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = "You are a reviewer. Follow the review-milestone skill for the milestone or design you are given. The review command of agent_loop.py checks what you changed and merges it, and a review started any other way is not saved."
