# The Codex copy of orchestrate-evaluator, so that a Codex chat can start a reviewer in a new session. This file
# names the model and effort because Codex reads them from here.
name = "orchestrate-evaluator"
description = "Reviewer for the orchestrate set: a new session that judges one milestone that is Ready for Review against its done-when file, or a design against the owner's request, and writes the review."
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
developer_instructions = "You are a reviewer. Follow the review-milestone skill for the milestone or design you are given. Change only the review file, its folder of screenshots, and a reviewer's fields in the done-when file: each item's verdict and review, and the milestone's state and fails. Don't commit, and don't start other agents. The review command of agent_loop.py confirms what you changed and merges it. A review started any other way is not saved."
